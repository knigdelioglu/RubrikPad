name: RubrikPad CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    name: Typecheck, tests and web build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies (refresh stale lockfile)
        run: bun install

      - name: Typecheck
        run: npm run lint

      - name: Install Ghostscript for PDF regression tests
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript

      - name: Unit tests
        run: npm test

      - name: Build web application
        run: npm run build

  android-apk:
    name: Build Android APK and publish prerelease
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android 16 SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install dependencies (refresh stale lockfile)
        run: bun install

      - name: Build web assets
        run: npm run build

      - name: Synchronize Capacitor Android project
        run: npx cap sync android

      - name: Build installable debug APK
        working-directory: android
        run: bash ./gradlew --no-daemon :app:assembleDebug

      - name: Prepare APK and checksum
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/RubrikPad-debug.apk
          cd release
          sha256sum RubrikPad-debug.apk > SHA256SUMS.txt

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RubrikPad-Android-debug
          path: release/
          if-no-files-found: error

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "snapshot-${GITHUB_RUN_NUMBER}" \
            release/RubrikPad-debug.apk release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "RubrikPad snapshot ${GITHUB_RUN_NUMBER}" \
            --notes "Automated CI build from commit ${GITHUB_SHA}. Debug-signed APK for Android 16 (API 36); not a production-signed release." \
            --prerelease

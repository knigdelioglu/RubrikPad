name: RubrikPad CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (Lint)
        run: npm run lint

      - name: Run Unit Tests (Scoring, Storage, Roster OCR, CSV/PDF Security)
        run: npm test

      - name: Build Production Bundle
        run: npm run build
